plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.google.gms.google-services"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.xox.madvise"
    compileSdk = 36 // use stable SDK 34, not preview 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.xox.madvise"
        minSdk = 23
        targetSdk = 36 // again, stable
        versionCode 2
        versionName "1.0.2"

    }
    buildFeatures {
        buildConfig = true
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:33.1.0") // ya latest stable version
    implementation "com.google.firebase:firebase-analytics-ktx" // version is managed by bom
}

